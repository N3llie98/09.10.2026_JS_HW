<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
</head>

<body>

    <p>Об'єм циліндра:</p>
    Радіус: <input id="input1" type="text" value="10"> <br>
    Висота: <input id="input2" type="text" value="5"> <br>
    <button id="resBtn">Result</button>
    <div id="resDiv"></div>

    <script>
        /*
        Задание:
        Напишите сценарий, который вычисляет объем цилиндра по параметрам, которые вводит пользователь.
        Для расчета используйте формулу - V=π * r в квадрате * h
        Разместите на странице два поля ввода - первое для радиуса цилиндра, второе для высоты цилиндра.
        Объем цилиндра выведите в тело страницы.
        */
        let input1 = document.querySelector("#input1");
        let input2 = document.querySelector("#input2");
        let resBtn = document.querySelector("#resBtn");
        let resDiv = document.querySelector("#resDiv");

        resBtn.addEventListener("click",volumeFormula);

        function volumeFormula(){
            let res = Math.PI * Math.pow(input1.value,2) * input2.value;
            resDiv.innerText = `Об'єм: ${res}`;
        }
    </script>
</body>

</html>
